<!doctype html>
<html>
<head>
  <title>Certificate Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .header {
      height: 40px;
      background: #202124;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 15px;
      font-size: 14px;
    }

    .viewer {
      width: 100vw;
      height: calc(100vh - 40px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

<div class="header">
  📄 Certificate Viewer
</div>

<div class="viewer">
  <iframe 
    src="https://docs.google.com/gview?url=https://abhaysrivas063.github.io/certificate-site/my.pdf&embedded=true">
  </iframe>
</div>

</body>
</html>
