<!doctype html>
<html>
<head>
  <title>Certificate Viewer</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .viewer {
      width: 90%;
      height: 95vh;
      background: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    embed {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

<div class="viewer">
  <!-- AUTO FIT WIDTH -->
  <embed src="my.pdf#zoom=page-width" type="application/pdf">
</div>

</body>
</html>
